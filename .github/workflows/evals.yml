name: evals

# Behavioral evals: does each skill fire on a natural prompt (Arabic and English) and improve the answer?
# Costs API credits, so it runs only on demand. Needs the ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case and arm
        default: "2"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin eval
        working-directory: plugins/builder-kit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
        run: |
          claude plugin eval . --trust-plugin --runs "$RUNS" --threshold 0.7 \
            --json "$RUNNER_TEMP/evals.json" --no-publish --max-cost-usd 15
