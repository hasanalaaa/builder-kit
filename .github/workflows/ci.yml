name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftests:
    name: self-tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run every tool's self-test
        run: |
          fail=0
          for t in plugins/builder-kit/skills/*/scripts/test_*.py plugins/builder-kit/hooks/test_*.py; do
            if python "$t"; then echo "ok   $t"; else echo "FAIL $t"; fail=1; fi
          done
          exit $fail
      - name: Shell scripts parse
        run: for s in plugins/builder-kit/skills/*/scripts/*.sh; do bash -n "$s"; done
      - name: Manifests are valid JSON
        run: |
          python -c "import json,sys; [json.load(open(p)) for p in sys.argv[1:]]" \
            .claude-plugin/marketplace.json plugins/builder-kit/.claude-plugin/plugin.json plugins/builder-kit/hooks/hooks.json

  ship-check:
    name: builder-kit gate on itself
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: ship_check (must be SHIP)
        run: python plugins/builder-kit/skills/ship/scripts/ship_check.py . --report SHIP_REPORT.md
      - name: Report in the job summary
        if: always()
        run: test -f SHIP_REPORT.md && cat SHIP_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true

  validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate plugins/builder-kit
      - run: claude plugin validate .
